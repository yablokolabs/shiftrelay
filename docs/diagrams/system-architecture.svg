<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-architecture-title system-architecture-desc" id="system-architecture-root">
  <title id="system-architecture-title">ShiftRelay system architecture</title>
  <desc id="system-architecture-desc">Architecture diagram showing the React console, the ShiftRelay Node API and deterministic gate, the app-owned canonical control store, and Meko's MCP, shared knowledge, conversations and artifact services.</desc>
