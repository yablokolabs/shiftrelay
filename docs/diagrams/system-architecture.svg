      #system-architecture-root .zone-label-bg { fill: #f4f6f9; }
      #system-architecture-root .zone-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 1.7px; fill: #667085; }
      #system-architecture-root .node { fill: #ffffff; stroke: #c6d2e1; stroke-width: 1; }
      #system-architecture-root .node-strong { fill: #ffffff; stroke: #0b1e4b; stroke-width: 1.2; }
      #system-architecture-root .node-focal { fill: rgba(15,157,143,0.075); stroke: #087a70; stroke-width: 1.5; }
      #system-architecture-root .node-store { fill: rgba(11,30,75,0.035); stroke: #667085; stroke-width: 1; }
      #system-architecture-root .node-ext { fill: rgba(11,30,75,0.025); stroke: #8a99ad; stroke-width: 1; }
      #system-architecture-root .tag { fill: none; stroke: rgba(11,30,75,0.24); stroke-width: 0.8; }
      #system-architecture-root .tag-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 7.5px; font-weight: 600; letter-spacing: 1px; fill: #667085; }
      #system-architecture-root .name { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 650; fill: #101828; }
      #system-architecture-root .sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #52647c; }
      #system-architecture-root .micro { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8.5px; fill: #667085; }
      #system-architecture-root .accent-text { fill: #087a70; }
      #system-architecture-root .arrow { fill: none; stroke: #52647c; stroke-width: 1.15; }
      #system-architecture-root .arrow-link { fill: none; stroke: #1d4ed8; stroke-width: 1.2; }
      #system-architecture-root .arrow-accent { fill: none; stroke: #087a70; stroke-width: 1.4; }
      #system-architecture-root .arrow-return { fill: none; stroke: #52647c; stroke-width: 1; stroke-dasharray: 5,4; }
      #system-architecture-root .label-bg { fill: #f4f6f9; }
      #system-architecture-root .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; letter-spacing: 0.5px; fill: #52647c; }
      #system-architecture-root .label-link { fill: #1d4ed8; }
      #system-architecture-root .label-accent { fill: #087a70; }
      #system-architecture-root .legend { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8.5px; fill: #52647c; }
      #system-architecture-root .legend-title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; font-weight: 600; letter-spacing: 1.7px; fill: #667085; }
      #system-architecture-root .note { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #52647c; }</style>
